name: fplayer
description: "Reproductor de video para Flutter sobre Media3/ExoPlayer: HLS, DASH, archivos locales, headers HTTP, subtítulos externos, storyboard, TV y PiP."
version: 0.5.0
homepage: https://github.com/chikenare/fplayer
repository: https://github.com/chikenare/fplayer

environment:
  sdk: ^3.13.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.chikenare.fplayer
        pluginClass: FplayerPlugin

topics:
  - video
  - video-player
  - hls
  - dash
  - android-tv
