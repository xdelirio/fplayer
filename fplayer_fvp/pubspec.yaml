name: fplayer_fvp
description: "Motor libmdk/FFmpeg de respaldo para fplayer: reproduce códecs que los decodificadores de Android no cubren, como AV1 por software en Android anterior a 12."
version: 0.1.0
homepage: https://github.com/chikenare/fplayer
repository: https://github.com/chikenare/fplayer

# Depends on fplayer by path while they live in one repository.
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  fplayer:
    path: ../
  fvp: ^0.38.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
