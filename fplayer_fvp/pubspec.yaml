name: fplayer_fvp
description: "A libmdk/FFmpeg fallback engine for fplayer: plays codecs Android's own decoders do not cover, chiefly AV1 by software on Android below 12."
version: 0.1.0
homepage: https://github.com/chikenare/fplayer
repository: https://github.com/chikenare/fplayer

# Depends on fplayer by path while they live in one repository.
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  fplayer:
    path: ../
  fvp: ^0.38.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
